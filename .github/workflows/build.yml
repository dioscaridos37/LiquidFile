name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже предустановлен на ubuntu-latest (ANDROID_HOME),
      # отдельный android-actions/setup-android не нужен.
      - name: Install Android 16 (API 36) SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KS_ALIAS:-liquid}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$KS" -storepass liquid123 -keypass liquid123 \
              -alias liquid -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Liquid Files"
            echo "KEYSTORE_PASSWORD=liquid123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=liquid123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=liquid" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidFiles-apk
          path: app/build/outputs/apk/release/*.apk
