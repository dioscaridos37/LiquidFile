name: Build APK

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find project root
        run: |
          S=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)
          if [ -z "$S" ]; then
            echo "settings.gradle.kts НЕ НАЙДЕН. Файлы в репозитории:"
            find . -not -path "./.git/*" | head -80
            exit 1
          fi
          ROOT=$(dirname "$S")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Корень проекта: $ROOT"
          ls -la "$ROOT" "$ROOT/app"

      - name: Write Gradle config (AGP 8.13, SDK 36)
        run: |
          cd "$ROOT"
          cat > settings.gradle.kts <<'EOT'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LiquidFiles"
          include(":app")
          EOT
          cat > build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.13.0" apply false
              id("org.jetbrains.kotlin.android") version "2.2.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.20" apply false
          }
          EOT
          cat > gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOT
          cat > app/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "dev.liquidfiles"
              compileSdk = 36

              defaultConfig {
                  applicationId = "dev.liquidfiles.manager"
                  minSdk = 33
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0.0"
              }

              val ksPath: String? = System.getenv("KEYSTORE_PATH")
              signingConfigs {
                  if (ksPath != null) {
                      create("release") {
                          storeFile = file(ksPath)
                          storePassword = System.getenv("KEYSTORE_PASSWORD")
                          keyAlias = System.getenv("KEY_ALIAS")
                          keyPassword = System.getenv("KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = if (ksPath != null) signingConfigs.getByName("release") else signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }

              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          dependencies {
              val bom = platform("androidx.compose:compose-bom:2025.09.00")
              implementation(bom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-compose:1.11.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.4")
              implementation("androidx.datastore:datastore-preferences:1.1.7")

              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("io.coil-kt:coil-video:2.7.0")
          }
          EOT

      - name: Install Android SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KS_ALIAS:-liquid}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$KS" -storepass liquid123 -keypass liquid123 \
              -alias liquid -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Liquid Files"
            echo "KEYSTORE_PASSWORD=liquid123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=liquid123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=liquid" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          cd "$ROOT"
          set +e
          gradle :app:assembleRelease --no-daemon --console=plain > "$GITHUB_WORKSPACE/build.log" 2>&1
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ]; then
            echo "=============== ОШИБКА СБОРКИ (главное) ==============="
            grep -n -E "^e: |error:|What went wrong|Caused by|Could not|FAILED|Unresolved" "$GITHUB_WORKSPACE/build.log" | head -60 || true
            echo "=============== КОНЕЦ ЛОГА ==============="
            tail -50 "$GITHUB_WORKSPACE/build.log"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/"

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidFiles-apk
          path: out/*.apk
